Hydraulic:
  adapter: "datasets.adapters.hydraulic:make_hydraulic_loaders"
  task: "Classification"
  args:
    data_dir: "../data/hydraulic_systems"
    channels: ["CP", "FS1", "PS1", "PS2", "PS3", "PS4", "PS5", "SE", "VS1"]
    label_cols: 2            # single target: pump (0=cooler, 1=valve, 2=pump, 3=acc)
    seq_len: 50
    batch_size: 32
    num_workers: 0
    filter_unstable: true
    stratify_on: "first"
    squeeze_single_target: true
